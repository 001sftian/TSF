[project]
name = "rogue-locator"
version = "0.1.0"
description = "Sparse-observation Transformer baseline for high-order rogue-wave detection and localization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
rogue-train = "rogue_locator.train:main"
rogue-infer = "rogue_locator.infer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
